<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>La Galette · Ma carte</title>
<script>
  /* Ancienne adresse de l'éditeur de La Galette : il est maintenant sur
     admin.vikto-labs.fr (identifiant et mot de passe). On garde ?menu=…,
     jamais le #… : l'ancien lien d'activation y portait la clé GitHub,
     elle ne doit voyager nulle part. */
  document.documentElement.className = 'depart';
  location.replace('https://admin.vikto-labs.fr/la-galette/' + location.search);
</script>
<style>
  :root { --bg: #fdfbf6; --fg: #141110; --muted: #6b645b; --accent: #8a6a12; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141110; --fg: #f6f0e4; --muted: #b5ab9c; --accent: #e3c766; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { box-sizing: border-box; max-width: 30rem; padding: 32px max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px)); text-align: center; }
  .marque { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.25; }
  p { margin: 0 0 14px; }
  a { color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }
  .depart main { display: none; }
</style>
</head>
<body>
<main>
  <p class="marque">La Galette · Ma carte</p>
  <h1>L'éditeur de la carte a changé d'adresse</h1>
  <p><a href="https://admin.vikto-labs.fr/la-galette/">admin.vikto-labs.fr/la-galette/</a></p>
</main>
</body>
</html>
